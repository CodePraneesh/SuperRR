name: SupeRR Intelligence CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests & Store Parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify Reproducibility Manifest Hashes
        run: python scripts/verify_manifest.py

      - name: Verify Submission Safety & Unstop Dropdown Parity
        run: python scripts/verify_submission.py

      - name: End-to-End Pipeline Reproduction (Conditional)
        run: |
          if [ -f "6af458274c1e8_data_pack.zip" ]; then
            echo "Data pack detected. Executing full end-to-end reproduction..."
            bash scripts/reproduce_phase8.sh 6af458274c1e8_data_pack.zip
          else
            echo "Notice: Raw data pack (6af458274c1e8_data_pack.zip) is not committed (180 MB gitignored). Skipping raw reproduction step; running manifest and store verification on checked-in official deliverables."
          fi

      - name: Build Official Scouting Store
        run: python scripts/build_official_store.py

      - name: Run Test Suite
        run: python -m pytest tests test_phase1_validation.py -q -rs

      - name: Official Rankings API & Store Parity Check
        run: python -m pytest tests/test_official_rankings_api.py -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
